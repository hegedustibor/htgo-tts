name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      # handlers/Native.go still uses oto v2, which drives ALSA through cgo on Linux.
      # Drop this step once the root package no longer imports handlers.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # staticcheck@latest may need a newer Go than this module targets; with
      # GOTOOLCHAIN=auto the go command fetches that toolchain for the install only.
      - name: Staticcheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Build
        run: go build ./...

      # The player packages, the native player included, must stay free of cgo:
      # oto 3.5 loads ALSA and CoreAudio at run time through purego.
      # The root package joins this check once it no longer imports handlers.
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./player/...

      - name: Test
        run: go test -race ./...
