name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # staticcheck@latest may need a newer Go than this module targets; with
      # GOTOOLCHAIN=auto the go command fetches that toolchain for the install only.
      - name: Staticcheck
        env:
          GOTOOLCHAIN: auto
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Build
        run: go build ./...

      # The whole module must build without cgo: oto 3.5 loads ALSA and
      # CoreAudio at run time through purego, and nothing else needs cgo.
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Test
        run: go test -race ./...
